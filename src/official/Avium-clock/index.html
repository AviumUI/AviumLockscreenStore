<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Avium Bubble UI Lockscreen</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrapper">
        <img src="image/Avium.svg" class="logo" alt="Avium UI">
        
        <div class="clock-container">
            <div class="time" id="time">00:00</div>
            <div class="date-pill" id="date">01.01 SUN</div>
        </div>
        
        <div class="status-bar">
            <div class="battery-module">
                <div class="battery-level" id="battery-level"></div>
                <span class="battery-val" id="battery-val">100%</span>
            </div>
            <div class="notification-badge" id="notification-badge"></div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
