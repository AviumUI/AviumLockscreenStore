<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Acid Geometry Lockscreen</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="acid-grid">
        <div class="header">
            <div class="date-stamp" id="date">--.--.--</div>
            <div class="noti-rhombus" id="noti"></div>
        </div>
        
        <div class="time-hero">
            <div class="hour-block" id="hour">00</div>
            <div class="minute-block" id="minute">00</div>
        </div>
        
        <div class="footer">
            <div class="battery-text" id="bat-text">100%</div>
            <div class="battery-line">
                <div class="battery-fill" id="bat-fill"></div>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
