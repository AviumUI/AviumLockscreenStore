<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nothing Phone Style Lockscreen</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="lockscreen-root">
        <!-- 主时区：巨型点阵数字 -->
        <main class="clock-zone">
            <div class="time-block dot-text">
                <span id="hours">00</span><span class="blink-colon">:</span><span id="minutes">00</span>
            </div>
            <div class="date-block dot-text">
                <span id="weekday">MON</span>
                <div class="divider"></div>
                <span id="month-day">01.01</span>
            </div>
        </main>

        <!-- 通知/小组件预览区 -->
        <section class="notification-zone">
            <div class="notif-pill" id="notification-hint">
                <span class="icon red-dot"></span>
                <span class="text dot-text">NO NEW MESSAGES</span>
            </div>
        </section>

        <!-- 底部指纹/解锁提示 -->
        <footer class="bottom-tools">
            <div class="fingerprint-scan">
                <!-- 指纹纹理抽象 -->
                <div class="fp-ring r1"></div>
                <div class="fp-ring r2"></div>
                <div class="fp-ring r3"></div>
                <div class="fp-core red-dot"></div>
            </div>
        </footer>
    </div>
    
    <script src="js/main.js"></script>
</body>
</html>
