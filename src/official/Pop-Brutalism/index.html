<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pop-Brutalism Lockscreen</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="lockscreen-container">
        <!-- 顶部状态栏 -->
        <div class="status-bar">
            <div class="battery-wrapper">
                <div class="battery">
                    <div class="battery-bar" id="battery-bar"></div>
                </div>
                <span class="battery-text" id="battery-level">--%</span>
            </div>
            <!-- 通知点：有通知时展示亮粉色呼吸灯效 -->
            <div class="notification-dot" id="notification-dot"></div>
        </div>

        <!-- 居中前卫大时钟 -->
        <div class="clock-wrapper">
            <div class="time-block">
                <div class="hours" id="hours">00</div>
                <div class="minutes" id="minutes">00</div>
            </div>
            <div class="date-block">
                <span class="month-day" id="date">01.01</span>
                <span class="day-of-week" id="weekday">SUN</span>
            </div>
        </div>
        
        <!-- 底部解锁提示 -->
        <div class="unlock-hint">
            SWIPE TO UNLOCK
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
