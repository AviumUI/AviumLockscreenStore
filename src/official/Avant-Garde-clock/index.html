<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Avant-Garde Pink-Blue Lockscreen</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="canvas">
        <div class="side-date" id="date-display"></div>
        
        <div class="time-core">
            <div class="hr-box" id="hr">00</div>
            <div class="min-box" id="min">00</div>
        </div>
        
        <div class="bottom-bar">
            <div class="bat-track">
                <div class="bat-fill" id="bat-fill"></div>
            </div>
            <div class="noti-orb" id="noti"></div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
