<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cartoon Pop Lockscreen</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="cartoon-canvas">
        <div class="top-hud">
            <div class="date-badge" id="date">--/--</div>
            <div class="noti-bubble" id="noti">!</div>
        </div>

        <div class="time-container">
            <div class="time-hours" id="hours">00</div>
            <div class="time-minutes" id="minutes">00</div>
        </div>

        <div class="bottom-hud">
            <div class="battery-wrapper">
                <div class="battery-body">
                    <div class="battery-juice" id="juice"></div>
                </div>
                <div class="battery-cap"></div>
            </div>
            <div class="battery-text" id="bat-text">100%</div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
